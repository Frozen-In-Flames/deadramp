name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Representative subset (one group per category, smoke gates)
        run: sh tools/ci_subset.sh
